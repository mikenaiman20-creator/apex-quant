services:
  chromadb:
    profiles:
      - isolated-chroma
    image: ${CHROMA_IMAGE:?Set CHROMA_IMAGE to a verified, digest-pinned image}
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - chroma-isolated

  streamlit:
    build:
      context: ../..
      dockerfile: deploy/phase0/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?Set PYTHON_IMAGE to a verified, digest-pinned image}
    restart: unless-stopped
    environment:
      HOME: /tmp
      STREAMLIT_CONFIG_DIR: /tmp/.streamlit
      XDG_CACHE_HOME: /tmp/.cache
      APEX_UI_OLLAMA_URL: ${APEX_UI_OLLAMA_URL:-http://ollama:11434}
      APEX_UI_OLLAMA_MODEL: ${APEX_UI_OLLAMA_MODEL:-qwen2.5-coder:1.5b}
    command:
      - streamlit
      - run
      - /app/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    volumes:
      - /home/ubuntu/apex_quant/app.py:/app/app.py:ro
      - /home/ubuntu/apex_quant/logs:/app/logs:ro
      - /home/ubuntu/apex_quant/data:/app/data:ro
    networks:
      - apex-internal
      - apex-llm-internal
    expose:
      - "8501"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:55d6d58fce77338d8b626abbbbec63b79deeb24db3fd67b8a99951a84083552f}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - apex-llm-internal
    expose:
      - "11434"
    mem_limit: 3g
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  oauth2-proxy:
    image: ${OAUTH2_PROXY_IMAGE:?Set OAUTH2_PROXY_IMAGE to a verified, digest-pinned image}
    restart: unless-stopped
    env_file:
      - ./oauth2-proxy.env
    command:
      - --http-address=0.0.0.0:4180
      - --provider=github
      - --scope=user:email read:org
      - --email-domain=*
      - --authenticated-emails-file=/etc/oauth2-proxy/allowed_emails
      # Redirect URL, cookie domain, and whitelist are supplied by
      # oauth2-proxy.env (OAUTH2_PROXY_REDIRECT_URL, OAUTH2_PROXY_COOKIE_DOMAIN,
      # OAUTH2_PROXY_WHITELIST_DOMAINS) so the public scheme always matches the
      # certificate and the browser-facing URL.
      - --upstream=static://200
      - --skip-provider-button=true
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --cookie-samesite=lax
      - --standard-logging=true
      - --auth-logging=true
    volumes:
      - ./allowed_emails:/etc/oauth2-proxy/allowed_emails:ro
    networks:
      - apex-internal
      - egress
    expose:
      - "4180"

  nginx:
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE to a verified, digest-pinned image}
    restart: unless-stopped
    depends_on:
      - oauth2-proxy
      - streamlit
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./certs/server.key:/etc/nginx/certs/server.key:ro
    networks:
      - apex-internal
      - egress

networks:
  apex-internal:
    name: apex-internal
    external: true
  apex-llm-internal:
    name: apex-llm-internal
    internal: true
  chroma-isolated:
    name: apex-chroma-isolated
    internal: true
  egress:
    name: apex-egress
    driver: bridge

volumes:
  chroma_data:
  ollama_data:
